<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — Sole</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sole: {
              50: '#faf9f7', 100: '#f5f3ef', 200: '#e8e4dc', 300: '#d4cdc0',
              400: '#b8ad9a', 500: '#9c8f7a', 600: '#7d7262', 700: '#655c50',
              800: '#544d44', 900: '#47413a',
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-sole-50 text-sole-900 antialiased min-h-screen">
  <nav class="sticky top-0 z-50 bg-sole-50/90 backdrop-blur-md border-b border-sole-200">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="text-xl font-medium tracking-tight">Sole</a>
      <div class="hidden md:flex items-center gap-8 text-sm">
        <a href="feed.html" class="text-sole-500 hover:text-sole-900 transition">Explore</a>
        <a href="messages.html" class="font-medium text-sole-900">Messages</a>
        <a href="dashboard.html" class="text-sole-500 hover:text-sole-900 transition">Dashboard</a>
      </div>
      <a href="account.html" class="w-9 h-9 rounded-full bg-sole-200 flex items-center justify-center text-sm font-medium">A</a>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-6 py-8">
    <h1 class="text-2xl font-light tracking-tight mb-8">Messages</h1>

    <div class="grid md:grid-cols-[280px_1fr] gap-6 h-[600px]">
      <!-- Conversation list -->
      <div class="bg-white border border-sole-200 rounded-2xl overflow-hidden flex flex-col">
        <div class="p-4 border-b border-sole-100">
          <input type="text" placeholder="Search..." 
            class="w-full px-3 py-2 text-sm bg-sole-50 border border-sole-200 rounded-lg focus:outline-none focus:border-sole-400">
        </div>
        <div class="flex-1 overflow-y-auto">
          <button class="w-full flex items-center gap-3 p-4 bg-sole-50 border-l-2 border-sole-900 text-left">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-sole-200 to-sole-300 shrink-0"></div>
            <div class="min-w-0 flex-1">
              <div class="flex justify-between items-baseline">
                <p class="font-medium text-sm truncate">luna.soles</p>
                <span class="text-xs text-sole-400">2h</span>
              </div>
              <p class="text-xs text-sole-500 truncate">Thank you for the tip 💕</p>
            </div>
          </button>
          <button class="w-full flex items-center gap-3 p-4 hover:bg-sole-50 text-left transition">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-sole-300 to-sole-100 shrink-0"></div>
            <div class="min-w-0 flex-1">
              <div class="flex justify-between items-baseline">
                <p class="font-medium text-sm truncate">aria.feet</p>
                <span class="text-xs text-sole-400">1d</span>
              </div>
              <p class="text-xs text-sole-500 truncate">Custom is ready, sending now</p>
            </div>
          </button>
          <button class="w-full flex items-center gap-3 p-4 hover:bg-sole-50 text-left transition">
            <div class="w-10 h-10 rounded-full bg-gradient-to-bl from-sole-100 to-sole-300 shrink-0"></div>
            <div class="min-w-0 flex-1">
              <div class="flex justify-between items-baseline">
                <p class="font-medium text-sm truncate">velvet.steps</p>
                <span class="text-xs text-sole-400">3d</span>
              </div>
              <p class="text-xs text-sole-500 truncate">Would you like a new set this week?</p>
            </div>
          </button>
        </div>
      </div>

      <!-- Chat area -->
      <div class="bg-white border border-sole-200 rounded-2xl flex flex-col overflow-hidden">
        <!-- Chat header -->
        <div class="px-5 py-4 border-b border-sole-100 flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-gradient-to-br from-sole-200 to-sole-300"></div>
          <div>
            <p class="font-medium text-sm">luna.soles</p>
            <p class="text-xs text-sole-500">Usually replies within a few hours</p>
          </div>
        </div>

        <!-- Messages -->
        <div class="flex-1 overflow-y-auto p-5 space-y-4">
          <div class="flex justify-end">
            <div class="max-w-[70%] px-4 py-2.5 bg-sole-900 text-white rounded-2xl rounded-br-md text-sm">
              Hi! Loved the morning set. Would you do a custom with red polish?
            </div>
          </div>
          <div class="flex justify-start">
            <div class="max-w-[70%] px-4 py-2.5 bg-sole-100 rounded-2xl rounded-bl-md text-sm">
              Of course 😊 Red is one of my favorites. $40 for 8 photos?
            </div>
          </div>
          <div class="flex justify-end">
            <div class="max-w-[70%] px-4 py-2.5 bg-sole-900 text-white rounded-2xl rounded-br-md text-sm">
              Perfect, tipping now.
            </div>
          </div>
          <div class="flex justify-start">
            <div class="max-w-[70%] px-4 py-2.5 bg-sole-100 rounded-2xl rounded-bl-md text-sm">
              Thank you for the tip 💕 I’ll send it tomorrow evening.
            </div>
          </div>
        </div>

        <!-- Input -->
        <div class="p-4 border-t border-sole-100">
          <div class="flex gap-3">
            <input type="text" placeholder="Write a message..."
              class="flex-1 px-4 py-2.5 text-sm bg-sole-50 border border-sole-200 rounded-full focus:outline-none focus:border-sole-400">
            <button class="px-5 py-2.5 bg-sole-900 text-white rounded-full text-sm font-medium hover:bg-sole-800 transition">
              Send
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
