<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account — Sole</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sole: {
              50: '#faf9f7', 100: '#f5f3ef', 200: '#e8e4dc', 300: '#d4cdc0',
              400: '#b8ad9a', 500: '#9c8f7a', 600: '#7d7262', 700: '#655c50',
              800: '#544d44', 900: '#47413a',
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-sole-50 text-sole-900 antialiased min-h-screen">
  <nav class="sticky top-0 z-50 bg-sole-50/90 backdrop-blur-md border-b border-sole-200">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="text-xl font-medium tracking-tight">Sole</a>
      <div class="hidden md:flex items-center gap-8 text-sm">
        <a href="feed.html" class="text-sole-500 hover:text-sole-900 transition">Explore</a>
        <a href="messages.html" class="text-sole-500 hover:text-sole-900 transition">Messages</a>
        <a href="dashboard.html" class="text-sole-500 hover:text-sole-900 transition">Dashboard</a>
      </div>
      <a href="account.html" class="w-9 h-9 rounded-full bg-sole-900 text-white flex items-center justify-center text-sm font-medium">A</a>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-6 py-10">
    <h1 class="text-2xl font-light tracking-tight mb-10">Account settings</h1>

    <!-- Profile section -->
    <section class="mb-12">
      <h2 class="text-sm font-medium tracking-wide uppercase text-sole-500 mb-5">Profile</h2>
      <div class="flex items-center gap-5 mb-6">
        <div class="w-20 h-20 rounded-full bg-gradient-to-br from-sole-200 to-sole-300"></div>
        <button class="px-4 py-2 text-sm border border-sole-300 rounded-full hover:bg-sole-100 transition">
          Change photo
        </button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-sole-600 mb-1.5">Display name</label>
          <input type="text" value="Alex" class="w-full px-4 py-2.5 bg-white border border-sole-200 rounded-xl focus:outline-none focus:border-sole-400">
        </div>
        <div>
          <label class="block text-sm text-sole-600 mb-1.5">Username</label>
          <input type="text" value="alex" class="w-full px-4 py-2.5 bg-white border border-sole-200 rounded-xl focus:outline-none focus:border-sole-400">
        </div>
        <div>
          <label class="block text-sm text-sole-600 mb-1.5">Bio</label>
          <textarea rows="3" class="w-full px-4 py-2.5 bg-white border border-sole-200 rounded-xl focus:outline-none focus:border-sole-400 resize-none">Fan of quiet, natural content.</textarea>
        </div>
      </div>
    </section>

    <!-- Subscriptions -->
    <section class="mb-12">
      <h2 class="text-sm font-medium tracking-wide uppercase text-sole-500 mb-5">Active subscriptions</h2>
      <div class="space-y-3">
        <div class="flex items-center justify-between p-4 bg-white border border-sole-200 rounded-xl">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-sole-200 to-sole-300"></div>
            <div>
              <p class="font-medium text-sm">luna.soles</p>
              <p class="text-xs text-sole-500">$12.99/mo · Renews Dec 17</p>
            </div>
          </div>
          <button class="text-sm text-sole-500 hover:text-sole-900">Manage</button>
        </div>
        <div class="flex items-center justify-between p-4 bg-white border border-sole-200 rounded-xl">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-sole-300 to-sole-100"></div>
            <div>
              <p class="font-medium text-sm">aria.feet</p>
              <p class="text-xs text-sole-500">$9.99/mo · Renews Nov 28</p>
            </div>
          </div>
          <button class="text-sm text-sole-500 hover:text-sole-900">Manage</button>
        </div>
      </div>
    </section>

    <!-- Account -->
    <section class="mb-12">
      <h2 class="text-sm font-medium tracking-wide uppercase text-sole-500 mb-5">Account</h2>
      <div class="space-y-3">
        <a href="#" class="flex items-center justify-between p-4 bg-white border border-sole-200 rounded-xl hover:border-sole-400 transition">
          <span class="text-sm">Email & password</span>
          <span class="text-sole-400">→</span>
        </a>
        <a href="#" class="flex items-center justify-between p-4 bg-white border border-sole-200 rounded-xl hover:border-sole-400 transition">
          <span class="text-sm">Payment methods</span>
          <span class="text-sole-400">→</span>
        </a>
        <a href="#" class="flex items-center justify-between p-4 bg-white border border-sole-200 rounded-xl hover:border-sole-400 transition">
          <span class="text-sm">Notifications</span>
          <span class="text-sole-400">→</span>
        </a>
        <a href="become-creator.html" class="flex items-center justify-between p-4 bg-white border border-sole-200 rounded-xl hover:border-sole-400 transition">
          <span class="text-sm">Become a creator</span>
          <span class="text-sole-400">→</span>
        </a>
      </div>
    </section>

    <div class="pt-6 border-t border-sole-200">
      <button class="text-sm text-red-600 hover:text-red-700">Log out</button>
    </div>
  </main>
</body>
</html>
