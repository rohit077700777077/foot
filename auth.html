<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Sole</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sole: {
              50: '#faf9f7',
              100: '#f5f3ef',
              200: '#e8e4dc',
              300: '#d4cdc0',
              400: '#b8ad9a',
              500: '#9c8f7a',
              600: '#7d7262',
              700: '#655c50',
              800: '#544d44',
              900: '#47413a',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-sole-50 text-sole-900 antialiased min-h-screen">
  <!-- Simple top bar -->
  <div class="px-6 h-16 flex items-center justify-between max-w-6xl mx-auto">
    <a href="index.html" class="text-xl font-medium tracking-tight">Sole</a>
    <a href="index.html" class="text-sm text-sole-500 hover:text-sole-800 transition">← Back</a>
  </div>

  <main class="flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">
      <!-- Toggle -->
      <div class="flex gap-8 mb-12 border-b border-sole-200">
        <button id="tab-login" class="pb-3 text-sm font-medium border-b-2 border-sole-900 text-sole-900">
          Log in
        </button>
        <button id="tab-signup" class="pb-3 text-sm font-medium border-b-2 border-transparent text-sole-500 hover:text-sole-800 transition">
          Sign up
        </button>
      </div>

      <!-- Login Form -->
      <form id="form-login" class="space-y-6">
        <div>
          <label class="block text-sm text-sole-600 mb-2">Email</label>
          <input type="email" required
            class="w-full px-4 py-3 bg-white border border-sole-200 rounded-xl focus:outline-none focus:border-sole-400 transition"
            placeholder="you@example.com">
        </div>
        <div>
          <label class="block text-sm text-sole-600 mb-2">Password</label>
          <input type="password" required
            class="w-full px-4 py-3 bg-white border border-sole-200 rounded-xl focus:outline-none focus:border-sole-400 transition"
            placeholder="••••••••">
        </div>
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 text-sole-600">
            <input type="checkbox" class="rounded border-sole-300">
            Remember me
          </label>
          <a href="#" class="text-sole-600 hover:text-sole-900 transition">Forgot password?</a>
        </div>
        <button type="submit"
          class="w-full py-3.5 bg-sole-900 text-white rounded-xl font-medium hover:bg-sole-800 transition">
          Log in
        </button>
      </form>

      <!-- Signup Form (hidden by default) -->
      <form id="form-signup" class="space-y-6 hidden">
        <div>
          <label class="block text-sm text-sole-600 mb-2">Username</label>
          <input type="text" required
            class="w-full px-4 py-3 bg-white border border-sole-200 rounded-xl focus:outline-none focus:border-sole-400 transition"
            placeholder="yourname">
        </div>
        <div>
          <label class="block text-sm text-sole-600 mb-2">Email</label>
          <input type="email" required
            class="w-full px-4 py-3 bg-white border border-sole-200 rounded-xl focus:outline-none focus:border-sole-400 transition"
            placeholder="you@example.com">
        </div>
        <div>
          <label class="block text-sm text-sole-600 mb-2">Password</label>
          <input type="password" required minlength="8"
            class="w-full px-4 py-3 bg-white border border-sole-200 rounded-xl focus:outline-none focus:border-sole-400 transition"
            placeholder="At least 8 characters">
        </div>
        <div class="text-xs text-sole-500 leading-relaxed">
          By creating an account you confirm you are 18+ and agree to our 
          <a href="#" class="underline hover:text-sole-800">Terms</a> and 
          <a href="#" class="underline hover:text-sole-800">Privacy Policy</a>.
        </div>
        <button type="submit"
          class="w-full py-3.5 bg-sole-900 text-white rounded-xl font-medium hover:bg-sole-800 transition">
          Create account
        </button>
      </form>

      <p class="mt-10 text-center text-sm text-sole-500">
        Want to create content? 
        <a href="become-creator.html" class="text-sole-800 font-medium hover:underline">Become a creator</a>
      </p>
    </div>
  </main>

  <script>
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const formLogin = document.getElementById('form-login');
    const formSignup = document.getElementById('form-signup');

    function showLogin() {
      tabLogin.classList.add('border-sole-900', 'text-sole-900');
      tabLogin.classList.remove('border-transparent', 'text-sole-500');
      tabSignup.classList.remove('border-sole-900', 'text-sole-900');
      tabSignup.classList.add('border-transparent', 'text-sole-500');
      formLogin.classList.remove('hidden');
      formSignup.classList.add('hidden');
      document.title = 'Log in — Sole';
    }

    function showSignup() {
      tabSignup.classList.add('border-sole-900', 'text-sole-900');
      tabSignup.classList.remove('border-transparent', 'text-sole-500');
      tabLogin.classList.remove('border-sole-900', 'text-sole-900');
      tabLogin.classList.add('border-transparent', 'text-sole-500');
      formSignup.classList.remove('hidden');
      formLogin.classList.add('hidden');
      document.title = 'Sign up — Sole';
    }

    tabLogin.addEventListener('click', showLogin);
    tabSignup.addEventListener('click', showSignup);

    // Check URL param
    const params = new URLSearchParams(window.location.search);
    if (params.get('mode') === 'signup') {
      showSignup();
    }

    // Demo submit handlers
    formLogin.addEventListener('submit', (e) => {
      e.preventDefault();
      window.location.href = 'feed.html';
    });
    formSignup.addEventListener('submit', (e) => {
      e.preventDefault();
      window.location.href = 'feed.html';
    });
  </script>
</body>
</html>
