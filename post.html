<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post — Sole</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sole: {
              50: '#faf9f7', 100: '#f5f3ef', 200: '#e8e4dc', 300: '#d4cdc0',
              400: '#b8ad9a', 500: '#9c8f7a', 600: '#7d7262', 700: '#655c50',
              800: '#544d44', 900: '#47413a',
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-sole-50 text-sole-900 antialiased min-h-screen">
  <nav class="sticky top-0 z-50 bg-sole-50/90 backdrop-blur-md border-b border-sole-200">
    <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="creator.html" class="text-sm text-sole-500 hover:text-sole-900 transition flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Back
      </a>
      <a href="index.html" class="text-xl font-medium tracking-tight">Sole</a>
      <div class="w-8"></div>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto px-6 py-8">
    <!-- Creator mini header -->
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-full bg-gradient-to-br from-sole-200 to-sole-300"></div>
      <div>
        <a href="creator.html" class="font-medium text-sm hover:underline">luna.soles</a>
        <p class="text-xs text-sole-500">2 days ago</p>
      </div>
    </div>

    <!-- Title & description -->
    <h1 class="text-xl font-medium mb-2">Morning light set</h1>
    <p class="text-sole-600 text-sm mb-8 leading-relaxed">
      Soft natural window light. 12 photos. Taken this morning.
    </p>

    <!-- Locked state (default) -->
    <div id="locked-view" class="relative">
      <div class="aspect-[4/5] rounded-2xl overflow-hidden bg-sole-200 relative">
        <div class="absolute inset-0 bg-gradient-to-br from-sole-200 via-sole-100 to-sole-300 blur-md scale-105"></div>
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-8">
          <div class="w-14 h-14 rounded-full bg-black/30 backdrop-blur flex items-center justify-center mb-4">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          </div>
          <p class="text-white font-medium mb-1">This post is locked</p>
          <p class="text-white/80 text-sm mb-6">Subscribe to unlock the full set</p>
          <button onclick="unlock()" class="px-6 py-2.5 bg-white text-sole-900 rounded-full text-sm font-medium hover:bg-sole-100 transition">
            Subscribe · $12.99/mo
          </button>
        </div>
      </div>
    </div>

    <!-- Unlocked state (hidden by default) -->
    <div id="unlocked-view" class="hidden space-y-3">
      <div class="aspect-[4/5] rounded-2xl overflow-hidden bg-gradient-to-br from-sole-200 via-sole-100 to-sole-300"></div>
      <div class="grid grid-cols-2 gap-3">
        <div class="aspect-square rounded-xl bg-gradient-to-tr from-sole-300 to-sole-100"></div>
        <div class="aspect-square rounded-xl bg-gradient-to-bl from-sole-100 to-sole-300"></div>
        <div class="aspect-square rounded-xl bg-gradient-to-t from-sole-200 to-sole-300"></div>
        <div class="aspect-square rounded-xl bg-gradient-to-br from-sole-300 via-sole-200 to-sole-100"></div>
      </div>
      <p class="text-center text-sm text-sole-500 pt-4">12 photos in this set</p>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-6 mt-8 pt-6 border-t border-sole-200">
      <button class="flex items-center gap-2 text-sm text-sole-600 hover:text-sole-900 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
        Like
      </button>
      <button class="flex items-center gap-2 text-sm text-sole-600 hover:text-sole-900 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        Comment
      </button>
      <button class="flex items-center gap-2 text-sm text-sole-600 hover:text-sole-900 transition ml-auto">
        Tip
      </button>
    </div>
  </main>

  <script>
    function unlock() {
      document.getElementById('locked-view').classList.add('hidden');
      document.getElementById('unlocked-view').classList.remove('hidden');
    }
  </script>
</body>
</html>
